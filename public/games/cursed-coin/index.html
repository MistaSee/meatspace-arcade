<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1b1420">
  <title>The Cursed Coin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <header id="hud">
      <div class="hud-left">
        <div id="hearts" role="img"></div>
        <div id="stats"><span id="floor"></span> · <span id="gold"></span></div>
      </div>
      <button id="mute" class="icon" type="button" aria-pressed="false">🔊</button>
      <div class="coin-wrap">
        <button id="coin" type="button" aria-label="Flip the coin">
          <span id="coin-inner">
            <span class="face heads">☺</span>
            <span class="face tails">☹</span>
          </span>
        </button>
        <div id="flipin"></div>
      </div>
    </header>

    <div id="stage">
      <canvas id="board"></canvas>
      <div id="banner" hidden></div>
    </div>

    <footer id="foot">
      <div id="mod"></div>
      <div id="log" aria-live="polite"></div>
    </footer>
  </main>

  <section id="title" class="overlay">
    <div class="card">
      <div class="big-coin" aria-hidden="true"><span>☺</span></div>
      <h1 data-copy="title"></h1>
      <p id="coin-id" class="coin-id" hidden></p>
      <div id="intro" class="intro"></div>
      <p class="how" data-copy="howTo"></p>
      <p class="how" data-copy="flipHint"></p>
      <button id="start" class="primary" type="button" data-copy="start"></button>
      <h2 data-copy="hallTitle"></h2>
      <ol id="hall-title" class="hall"></ol>
    </div>
  </section>

  <section id="death" class="overlay" hidden>
    <div class="card">
      <div class="skull" aria-hidden="true">😵</div>
      <h2 id="death-head" class="death-head"></h2>
      <p id="epitaph" class="epitaph"></p>
      <p id="final-score" class="score"></p>
      <p id="score-sum" class="score-sum"></p>
      <form id="carve-form">
        <label for="name" data-copy="namePrompt"></label>
        <div class="row">
          <input id="name" maxlength="12" autocomplete="nickname" enterkeyhint="done" required>
          <button class="primary" type="submit" data-copy="carve"></button>
        </div>
      </form>
      <p id="carved" class="carved" hidden></p>
      <h2 data-copy="hallTitle"></h2>
      <ol id="hall-death" class="hall"></ol>
      <button id="again" class="primary" type="button" data-copy="again"></button>
    </div>
  </section>

  <script type="module" src="game.js"></script>
</body>
</html>
