<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1b1420">
  <title>Egg-and-Spoon Race</title>
  <link rel="stylesheet" href="../../shared/arcade.css">
  <style>
    header { display: flex; align-items: center; gap: 12px; padding: 12px 2px 6px; }
    .progress { flex: 1; }
    #track { position: relative; height: 14px; border-radius: 7px; background: #ffffff14; }
    #trackFill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 7px; background: var(--green); transition: width .25s ease; }
    #flag { position: absolute; right: -4px; top: -10px; font-size: 22px; }
    #runner { position: absolute; top: -12px; left: 0; font-size: 24px; transform: translateX(-50%) scaleX(-1); transition: left .25s ease; }
    #stepsLabel { font-size: 14px; color: var(--dim); margin-top: 10px; }
    #clock { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--gold); min-width: 86px; text-align: right; }
    #stage { flex: 1; min-height: 0; position: relative; display: grid; place-items: center; touch-action: none; }
    footer { min-height: 92px; padding: 6px 2px 14px; display: flex; flex-direction: column; gap: 6px; }
    #commentary { font-size: 19px; font-weight: 700; line-height: 1.3; min-height: 50px; }
    .foot-row { display: flex; justify-content: space-between; align-items: center; color: var(--dim); font-size: 14px; }
  </style>
</head>
<body>
  <main id="app">
    <header>
      <div class="progress">
        <div id="track"><i id="trackFill"></i><span id="runner">🏃</span><span id="flag">🏁</span></div>
        <div id="stepsLabel"></div>
      </div>
      <div id="clock">0.0s</div>
    </header>
    <div id="stage"><canvas id="board"></canvas></div>
    <footer>
      <div id="commentary" aria-live="polite"></div>
      <div class="foot-row"><span id="eggs"></span><button id="giveup" class="quiet" type="button"></button></div>
    </footer>
  </main>

  <section id="title" class="overlay">
    <div class="card">
      <div class="hero" aria-hidden="true">🥚🥄</div>
      <h1 data-copy="title"></h1>
      <p data-copy="pitch"></p>
      <div id="how"></div>
      <p class="dim" data-copy="safety"></p>
      <div id="nosensors" class="warn" hidden></div>
      <button id="start" class="primary" type="button" data-copy="start"></button>
      <h2 data-copy="hallTitle"></h2>
      <ol id="hall-title" class="hall"></ol>
    </div>
  </section>

  <section id="ready" class="overlay center" hidden>
    <div class="card">
      <p id="ready-text"></p>
      <div id="count" class="countdown">3</div>
    </div>
  </section>

  <section id="finish" class="overlay" hidden>
    <div class="card">
      <div class="hero" aria-hidden="true">🏆</div>
      <h1 id="finish-title"></h1>
      <p id="finish-line"></p>
      <p id="finish-time" class="big-number"></p>
      <p id="finish-detail" class="sub-number"></p>
      <form id="carve" class="carve">
        <label for="name" data-copy="namePrompt"></label>
        <div class="row">
          <input id="name" maxlength="12" autocomplete="nickname" enterkeyhint="done" required>
          <button class="primary" type="submit" data-copy="carve"></button>
        </div>
      </form>
      <p id="carved" class="carved" hidden></p>
      <h2 data-copy="hallTitle"></h2>
      <ol id="hall-finish" class="hall"></ol>
      <button id="again" class="primary" type="button" data-copy="again"></button>
    </div>
  </section>

  <script type="module" src="game.js"></script>
</body>
</html>
