<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Draw Blind</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;500&display=swap">
  <style>
    /* A darkroom. Everything on screen is safelight red, and dim, so the phones themselves do not fog the picture. */
    :root { --red: #e0241a; --dim: #8f1a12; --edge: #f2a23a; }
    html, body { margin: 0; height: 100%; background: #000; color: var(--red); overflow: hidden; overscroll-behavior: none; touch-action: none;
      -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; font-family: "Oswald", "Arial Narrow", sans-serif; font-weight: 300; }
    canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    video { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    #paint { position: fixed; inset: 0; display: none; z-index: 5; pointer-events: none; }
    section { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 28px 26px; box-sizing: border-box; text-align: center; z-index: 2; }
    section.on { display: flex; }
    /* The lamp over the bench. */
    #home::before { content: ""; position: absolute; top: -18vh; left: 50%; width: 120vw; height: 60vh; transform: translateX(-50%);
      background: radial-gradient(closest-side, rgba(224, 36, 26, 0.34), rgba(224, 36, 26, 0) 70%); pointer-events: none; }
    h1 { margin: 0; font-weight: 500; font-size: min(24vw, 15vh); line-height: 0.92; letter-spacing: 0.04em; text-shadow: 0 0 26px rgba(224, 36, 26, 0.55); }
    p { margin: 0; font-size: 17px; line-height: 1.45; letter-spacing: 0.05em; max-width: 30ch; }
    p.small { font-size: 14px; color: var(--dim); }
    button { font: inherit; font-weight: 500; font-size: 17px; letter-spacing: 0.18em; color: var(--red); background: none; border: 1px solid var(--red); padding: 16px 20px; min-width: 76vw; border-radius: 0; }
    button:active { background: var(--red); color: #000; }
    button.quiet { border-color: var(--dim); color: var(--dim); min-width: 0; font-size: 13px; padding: 11px 16px; }
    .row { display: flex; gap: 12px; }
    .row button { min-width: 0; flex: 1; }
    /* While the shutter is open the controls sit at the foot of the picture and stay out of its way. */
    #camSetup, #camExpose, #camVerdict { justify-content: flex-end; padding-bottom: 34px; }
    #camSetup p, #camVerdict p, #camSetup .small { text-shadow: 0 0 8px #000, 0 0 8px #000; }
    #count { font-size: 44vw; font-weight: 500; line-height: 1; text-shadow: 0 0 40px rgba(224, 36, 26, 0.6); }
    #bar { width: 76vw; height: 2px; background: var(--dim); }
    #bar i { display: block; height: 100%; width: 0; background: var(--red); box-shadow: 0 0 8px var(--red); }
    /* The contact sheet: every frame of the roll, printed small, with the good ones ringed in grease pencil. */
    #sheet { justify-content: flex-start; overflow-y: auto; touch-action: pan-y; gap: 16px; padding-top: 26px; }
    #sheet h2 { margin: 0; font-weight: 500; font-size: 20px; letter-spacing: 0.3em; }
    #frames { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; width: 100%; background: #0b0b0b; border-top: 13px solid #0b0b0b; border-bottom: 13px solid #0b0b0b; }
    figure { margin: 0; position: relative; padding: 15px 5px; }
    figure img { display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: cover; background: #000; }
    figcaption { position: absolute; top: 0; left: 7px; font-size: 10px; letter-spacing: 0.14em; color: var(--edge); }
    figure::after { content: "▸ ▸"; position: absolute; bottom: 0; right: 7px; font-size: 8px; letter-spacing: 0.3em; color: var(--edge); }
    figure.got::before { content: ""; position: absolute; inset: 6px -1px; border: 3px solid var(--red); border-radius: 48% 52% 46% 54% / 52% 46% 54% 48%; transform: rotate(-5deg); z-index: 1; }
    #score { font-size: 30px; font-weight: 500; letter-spacing: 0.12em; }
    /* A brush phone: black until pressed. */
    #word { font-size: min(15vw, 9vh); font-weight: 500; line-height: 1; letter-spacing: 0.04em; min-height: 1em; }
    /* Once painting starts the word goes dim, so it does not paint itself into the picture. */
    #word.dim { color: #4a0d09; }
    #dots { display: flex; gap: 14px; }
    #dots i { width: 34px; height: 34px; border-radius: 50%; opacity: 0.32; border: 2px solid transparent; box-sizing: border-box; }
    #dots i.on { opacity: 0.8; border-color: #444; }
  </style>
</head>
<body>
  <canvas id="view" aria-label="Draw Blind: pictures drawn in the air with light"></canvas>
  <video id="cam" playsinline muted></video>
  <div id="paint"></div>

  <section id="home" class="on">
    <h1 id="title"></h1>
    <p id="rule"></p>
    <button id="beCamera"></button>
    <button id="beBrush"></button>
    <p id="homeNote" class="small"></p>
  </section>

  <section id="camSetup">
    <p id="team"></p>
    <p id="propUp" class="small"></p>
    <p id="tooBright"></p>
    <button id="open"></button>
    <div class="row"><button id="flip" class="quiet"></button><button id="toSheet" class="quiet"></button></div>
  </section>
  <section id="camCount"><div id="count"></div></section>
  <section id="camExpose"><div id="bar"><i></i></div><button id="close" class="quiet"></button></section>
  <section id="camVerdict">
    <p id="didThey"></p>
    <div class="row" style="width:100%"><button id="got"></button><button id="missed"></button></div>
  </section>
  <section id="sheet">
    <h2 id="sheetTitle"></h2>
    <div id="frames"></div>
    <div id="score"></div>
    <button id="again"></button>
  </section>

  <section id="brush">
    <div id="word"></div>
    <p id="hide" class="small"></p>
    <div id="dots"></div>
    <button id="another" class="quiet"></button>
    <p id="brightness" class="small"></p>
  </section>

  <!-- Always fetch the newest game: phones otherwise keep an old copy for ten minutes after a fix. -->
  <script type="module">import(`./game.js?v=${Date.now()}`);</script>
</body>
</html>
