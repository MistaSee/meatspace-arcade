<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#140d10">
  <title>Shake Duel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="../../shared/arcade.css">
  <link rel="preload" as="image" href="art/arena.webp">
  <style>
    :root {
      --ink: #fff4dc;
      --ink-dark: #1a0f0a;
      --blood: #e23d3d;
      --gold: #ffc93c;
      --toxic: #9be15d;
      --comic: "Bangers", "Impact", "Arial Black", sans-serif;
      --body: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
      --px: 0px; --py: 0px;
    }
    html, body { background: #140d10; font-family: var(--body); }

    /* ---------- the arena ---------- */
    #stage { position: fixed; inset: 0; overflow: hidden; display: flex; justify-content: center; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    #bg {
      position: absolute; inset: -6%;
      background: radial-gradient(ellipse at 50% 60%, #6b3a1f 0%, #2a1610 55%, #120a08 100%);
      background-size: cover; background-position: center 40%;
      transform: translate(var(--px), var(--py)) scale(1.04);
      transition: transform .12s linear;
    }
    #bg.art { background-image: url(art/arena.webp); }
    #bg::after { content: ""; position: absolute; inset: 0;
      background: linear-gradient(#000c 0%, #0000 26%, #0000 58%, #000d 100%), radial-gradient(ellipse at 50% 55%, #0000 45%, #000a 100%); }
    #fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; }
    #aura { position: absolute; inset: 0; pointer-events: none; z-index: 3; opacity: 0; transition: opacity .2s; }
    #aura.fire { box-shadow: inset 0 0 90px 30px #ff6a1acc; }
    #aura.frost { box-shadow: inset 0 0 110px 40px #9fe8ffdd; background: radial-gradient(ellipse at center, #0000 50%, #bdefff55 100%); }
    #aura.thunder { box-shadow: inset 0 0 90px 30px #ffe04acc; }
    #aura.holy { box-shadow: inset 0 0 120px 40px #fff2b0dd; }
    #aura.normal { box-shadow: inset 0 0 80px 24px #ff9a3caa; }
    #aura.danger { box-shadow: inset 0 0 120px 30px #ff1a1aaa; }
    #flash { position: absolute; inset: 0; pointer-events: none; z-index: 6; opacity: 0; }
    #flash.go { animation: flash .45s ease-out; }
    @keyframes flash { from { opacity: .85; } to { opacity: 0; } }

    #app { position: relative; z-index: 5; padding-left: 10px; padding-right: 10px; }

    /* ---------- top HUD: opponent nameplate ---------- */
    #hud { padding-top: max(10px, env(safe-area-inset-top)); display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: start; }
    #plate { min-width: 0; }
    #foe-label { font-family: var(--comic); font-size: 14px; letter-spacing: 1.5px; color: var(--gold); text-shadow: 0 2px 0 #000; }
    #foe-name { font-family: var(--comic); font-size: 25px; line-height: 1; letter-spacing: .5px; color: var(--ink);
      text-shadow: 0 3px 0 #000, 2px 0 0 #000, -2px 0 0 #000, 0 -2px 0 #000; min-height: 25px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .types { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
    .badge { font-family: var(--comic); font-size: 14px; letter-spacing: 1px; padding: 2px 9px 1px; border-radius: 6px;
      color: #1a0f0a; border: 2px solid #000; box-shadow: 0 2px 0 #000; transform: skew(-8deg); text-transform: uppercase; }
    .badge.found { background: #1a0f0a !important; color: var(--ink); }
    #foe-hp { position: relative; height: 20px; margin-top: 6px; border: 3px solid #000; border-radius: 5px; background: #2b1214;
      transform: skew(-12deg); box-shadow: 0 3px 0 #000, inset 0 2px 0 #fff2; overflow: hidden; }
    #foe-hp i { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; }
    #foe-hp .trail { background: #fff; transition: width .6s ease .35s; }
    #foe-hp .fill { background: linear-gradient(#ffd25c, #ff8a1e 55%, #d4471a); transition: width .25s ease, background .3s; }
    #foe-hp.low .fill { background: linear-gradient(#ff7b7b, #e23d3d 55%, #8f1414); animation: lowpulse .6s ease-in-out infinite alternate; }
    @keyframes lowpulse { to { filter: brightness(1.5); } }
    #foe-hp::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, #0000 0 calc(10% - 2px), #0006 calc(10% - 2px) 10%); }
    #foe-name.long { font-size: 19px; padding-top: 4px; }
    #foe-rule { font-size: 13px; font-weight: 600; color: #ffe7a6; margin-top: 6px; line-height: 1.25; text-shadow: 0 1px 2px #000, 0 0 6px #000; min-height: 16px; }

    #side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
    #score { font-family: var(--comic); font-size: 26px; letter-spacing: 1px; color: var(--gold); min-width: 64px; text-align: right;
      text-shadow: 0 3px 0 #000, 2px 0 0 #000, -2px 0 0 #000; font-variant-numeric: tabular-nums; }
    #score.bump { animation: bump .3s ease; }
    @keyframes bump { 50% { transform: scale(1.35); } }
    #hearts { display: flex; gap: 3px; }
    #hearts svg { width: 28px; height: 26px; filter: drop-shadow(0 2px 0 #000); }
    #hearts .on path { fill: #e23d3d; stroke: #000; stroke-width: 2.5; }
    #hearts .on .shine { fill: #fff8; stroke: none; }
    #hearts .off path { fill: #3a2228; stroke: #000; stroke-width: 2.5; }
    #hearts .off .shine { display: none; }
    #hearts .lost { animation: heartbreak .6s ease; }
    @keyframes heartbreak { 0% { transform: scale(1.6) rotate(-15deg); } 50% { transform: scale(.7) rotate(12deg); } 100% { transform: none; } }

    /* ---------- the opponent ---------- */
    #arena { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
    #foe-wrap { position: relative; width: min(84vw, 400px); aspect-ratio: 1; margin-bottom: -2%; transition: transform .28s cubic-bezier(.3,1.6,.5,1); }
    #shadow { position: absolute; left: 18%; right: 18%; bottom: 3%; height: 9%; border-radius: 50%; background: radial-gradient(#000b, #0000 70%); }
    #foe { position: absolute; inset: 0; display: grid; place-items: center; transform-origin: 50% 92%; animation: breathe 1.5s ease-in-out infinite; }
    #foe img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 6px 0 #0007); pointer-events: none; }
    #foe .glyph { font-size: min(52vw, 230px); line-height: 1; filter: drop-shadow(0 6px 0 #0007); }
    @keyframes breathe { 0%,100% { transform: scale(1, 1); } 50% { transform: scale(1.035, .965); } }
    #foe-wrap.enter #foe { animation: enter .7s cubic-bezier(.2,1.6,.4,1) both, breathe 1.5s ease-in-out .7s infinite; }
    @keyframes enter { from { transform: translateY(-120%) scale(.6, 1.3); opacity: 0; } 60% { transform: translateY(0) scale(1.25, .75); opacity: 1; } to { transform: none; } }
    #foe-wrap.lean-left { transform: translateX(-24%) rotate(-12deg) scale(1.08); }
    #foe-wrap.lean-right { transform: translateX(24%) rotate(12deg) scale(1.08); }
    #foe-wrap.lean-top { transform: translateY(-16%) scale(1.15); }
    #foe-wrap.lean-bottom { transform: translateY(10%) scale(.9, 1.05); }
    #foe-wrap.windup #foe { animation: windup .12s linear infinite; }
    #foe-wrap.windup #foe img, #foe-wrap.windup #foe .glyph { filter: drop-shadow(0 0 14px #ff2a2a) drop-shadow(0 6px 0 #0007); }
    @keyframes windup { 0%,100% { transform: translate(0,0); } 25% { transform: translate(-3px,2px); } 75% { transform: translate(3px,-2px); } }
    #foe-wrap.lunge { transform: scale(1.7) translateY(12%); transition: transform .12s ease-in; }
    #foe-wrap.whiff-left { transform: translateX(-75%) rotate(-25deg) scale(1.2); transition: transform .2s ease-in; }
    #foe-wrap.whiff-right { transform: translateX(75%) rotate(25deg) scale(1.2); transition: transform .2s ease-in; }
    #foe-wrap.whiff-top { transform: translateY(-60%) scale(1.3); transition: transform .2s ease-in; }
    #foe-wrap.whiff-bottom { transform: translateY(40%) scale(1.3); transition: transform .2s ease-in; }
    #foe-wrap.scan #foe { animation: scan 1.1s ease-in-out infinite; }
    @keyframes scan { 0%,100% { transform: rotate(-9deg) translateX(-6%); } 50% { transform: rotate(9deg) translateX(6%); } }
    #foe-wrap.hunt #foe { animation: hunt .9s ease-in-out infinite; }
    @keyframes hunt { 0%,100% { transform: scale(1.1) translate(-10%, -4%); } 50% { transform: scale(1.18) translate(10%, -6%); } }
    #foe-wrap.hit #foe { animation: hit .5s ease-out; }
    @keyframes hit { 0% { transform: translate(0,0) scale(1.1, .85); filter: brightness(0) invert(1); } 15% { transform: translate(10%, -6%) rotate(10deg) scale(.9, 1.1); filter: brightness(0) invert(1); }
      30% { filter: none; transform: translate(-6%, 0) rotate(-6deg); } 50% { transform: translate(4%, 0) rotate(3deg); } 100% { transform: none; } }
    #foe-wrap.t-fire #foe img { filter: sepia(1) saturate(4) hue-rotate(-30deg) brightness(.9) drop-shadow(0 0 10px #ff6a1a); }
    #foe-wrap.t-frost #foe img { filter: saturate(.4) brightness(1.2) hue-rotate(170deg) drop-shadow(0 0 10px #8fe3ff); }
    #foe-wrap.t-thunder #foe img { animation: zap .08s steps(2) 6; }
    @keyframes zap { 50% { filter: invert(1) brightness(1.5); } }
    #foe-wrap.t-holy #foe img { filter: brightness(1.6) saturate(.5) drop-shadow(0 0 18px #fff1a0); }
    #foe-wrap.heal #foe img { filter: drop-shadow(0 0 16px #7bd389) brightness(1.15); }
    #foe-wrap.out { transform: translate(60%, -120%) rotate(540deg) scale(.15); opacity: 0; transition: transform 1.1s cubic-bezier(.4,-0.3,.7,1), opacity 1.1s ease-in; }
    #foe-wrap.gone { opacity: 0; }

    /* ---------- incoming blows ---------- */
    #strike { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
    #strike .band { position: absolute; display: flex; align-items: center; justify-content: center; gap: 6px; overflow: hidden;
      background: linear-gradient(var(--dir, 90deg), #ff1a1a00, #ff1a1a66 40%, #ff3b1acc); animation: bandpulse .25s ease-in-out infinite alternate; }
    #strike .band b { font-family: var(--comic); font-size: 64px; color: #fff; text-shadow: 0 4px 0 #6a0000, 0 0 18px #ff2a2a; animation: chevron .5s linear infinite; }
    #strike.left .band { left: 0; top: 18%; bottom: 18%; width: 34%; --dir: 270deg; }
    #strike.right .band { right: 0; top: 18%; bottom: 18%; width: 34%; --dir: 90deg; }
    #strike.top .band { top: 0; left: 0; right: 0; height: 30%; --dir: 0deg; flex-direction: column; }
    #strike.bottom .band { bottom: 0; left: 0; right: 0; height: 30%; --dir: 180deg; flex-direction: column; }
    @keyframes bandpulse { to { opacity: .7; } }
    @keyframes chevron { 0% { opacity: .2; } 50% { opacity: 1; } 100% { opacity: .2; } }
    #strike .band b:nth-child(2) { animation-delay: .12s; } #strike .band b:nth-child(3) { animation-delay: .24s; }
    #strike.whoosh .band { animation: whoosh .3s ease-in forwards; }
    @keyframes whoosh { to { opacity: 0; transform: scale(1.6); } }
    #strike.smash .band { animation: smash .3s ease-out forwards; }
    @keyframes smash { 0% { opacity: 1; filter: brightness(2); } 100% { opacity: 0; transform: scale(3); } }
    #clock { position: absolute; left: 50%; top: 4%; width: 46%; height: 8px; translate: -50% 0; border-radius: 4px; background: #0008; overflow: hidden; border: 2px solid #000; }
    #clock i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #ff3b1a, #ffc93c); transform-origin: left; }

    /* ---------- big words ---------- */
    #prompt { position: absolute; left: 0; right: 0; top: 36%; z-index: 7; text-align: center; pointer-events: none;
      font-family: var(--comic); font-size: 72px; line-height: .95; letter-spacing: 2px; color: var(--gold);
      -webkit-text-stroke: 3px #000; paint-order: stroke fill; text-shadow: 0 6px 0 #000, 0 0 24px #000a; }
    #prompt.big { animation: pop .35s cubic-bezier(.2,1.8,.4,1); }
    @keyframes pop { from { transform: scale(2.2) rotate(-6deg); opacity: 0; } to { transform: none; opacity: 1; } }
    #prompt.danger { color: #ff5a3a; }
    #prompt.danger.big { animation: pop .35s cubic-bezier(.2,1.8,.4,1), throb .45s ease-in-out .35s infinite alternate; }
    @keyframes throb { to { transform: scale(1.08); } }
    #prompt.cool { color: #9be8ff; }
    #prompt.long { font-size: 52px; }
    #prompt.small { font-size: 40px; }

    #pops { position: absolute; inset: 0; pointer-events: none; z-index: 8; overflow: hidden; }
    .pop { position: absolute; translate: -50% -50%; font-family: var(--comic); white-space: nowrap; -webkit-text-stroke: 3px #000; paint-order: stroke fill; }
    .pop.dmg { font-size: 64px; color: #fff; text-shadow: 0 5px 0 #000; animation: dmg 1.2s ease-out forwards; }
    .pop.dmg.super { font-size: 84px; color: #ffe04a; }
    .pop.dmg.weak { font-size: 46px; color: #c9c0b0; }
    .pop.dmg.heal { color: #7bd389; }
    @keyframes dmg { 0% { opacity: 0; transform: scale(.4); } 12% { opacity: 1; transform: scale(1.4) rotate(-6deg); } 30% { transform: scale(1) rotate(-3deg); } 75% { opacity: 1; transform: translateY(-50px) rotate(-3deg); } 100% { opacity: 0; transform: translateY(-80px) rotate(-3deg); } }
    .pop.word { font-size: 58px; color: #fff36b; padding: 26px 34px; animation: word .8s ease-out forwards; }
    .pop.word::before { content: ""; position: absolute; inset: 0; z-index: -1; background: #e23d3d; border: 4px solid #000;
      clip-path: polygon(50% 0, 61% 26%, 92% 8%, 76% 38%, 100% 50%, 76% 62%, 92% 92%, 61% 74%, 50% 100%, 39% 74%, 8% 92%, 24% 62%, 0 50%, 24% 38%, 8% 8%, 39% 26%); }
    @keyframes word { 0% { transform: scale(0) rotate(-20deg); } 25% { transform: scale(1.2) rotate(-8deg); } 70% { opacity: 1; transform: scale(1) rotate(-8deg); } 100% { opacity: 0; transform: scale(1.3) rotate(-8deg); } }
    .pop.banner { left: 50% !important; font-size: 40px; color: #fff; padding: 6px 26px 4px; transform-origin: center; text-shadow: 0 3px 0 #000;
      background: linear-gradient(90deg, #0000, var(--c, #e23d3d) 12%, var(--c, #e23d3d) 88%, #0000); -webkit-text-stroke: 2px #000;
      animation: banner 1.8s cubic-bezier(.2,1.4,.4,1) forwards; }
    .pop.banner.super { --c: #e23d3dee; color: #ffe04a; }
    .pop.banner.weak { --c: #4a4a5aee; font-size: 30px; }
    .pop.banner.none { --c: #222e; font-size: 30px; }
    .pop.banner.crit { --c: #ff8a1aee; font-size: 34px; }
    .pop.banner.heal { --c: #2f8a46ee; font-size: 30px; }
    @keyframes banner { 0% { transform: translateX(-120%) skew(-12deg) rotate(-4deg); } 18% { transform: translateX(0) skew(-12deg) rotate(-4deg); } 80% { opacity: 1; transform: translateX(0) skew(-12deg) rotate(-4deg); } 100% { opacity: 0; transform: translateX(120%) skew(-12deg) rotate(-4deg); } }
    .pop.ko { font-size: 150px; color: #ffe04a; -webkit-text-stroke: 6px #000; text-shadow: 0 10px 0 #000, 0 0 40px #ff3b1a; animation: ko 2.2s cubic-bezier(.2,1.6,.4,1) forwards; }
    @keyframes ko { 0% { transform: scale(5) rotate(-20deg); opacity: 0; } 15% { transform: scale(1) rotate(-8deg); opacity: 1; } 85% { transform: scale(1.1) rotate(-8deg); opacity: 1; } 100% { transform: scale(1.4) rotate(-8deg); opacity: 0; } }

    /* ---------- bottom: commentary and moves ---------- */
    footer#bottom { position: relative; padding: 0 0 max(12px, env(safe-area-inset-bottom)); z-index: 9; }
    #meter { height: 22px; margin: 0 6% 8px; border: 3px solid #000; border-radius: 12px; background: #000a; overflow: hidden; visibility: hidden; box-shadow: 0 3px 0 #000; position: relative; }
    #meter.on { visibility: visible; }
    #meter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #ffc93c, #ff6a1a); transition: width .08s linear; }
    #meter.full i { animation: full .2s steps(2) infinite; }
    @keyframes full { 50% { filter: brightness(1.8); } }
    #meter.e-fire i { background: linear-gradient(90deg, #ffd23c, #ff6a1a, #e8361c); }
    #meter.e-frost i { background: linear-gradient(90deg, #e8fbff, #7fdcff, #3d9be0); }
    #meter.e-thunder i { background: linear-gradient(90deg, #fff7a0, #ffe04a, #ffb21a); }
    #meter.e-holy i { background: linear-gradient(90deg, #fffbe6, #ffe48a, #ffd04a); }
    #meter.gentle i { background: linear-gradient(90deg, #f6e7a8, #f3c76b); }
    #meter.solid { border-color: #ff3b3b; }
    #box { background: #fff4dc; color: #1a0f0a; border: 4px solid #1a0f0a; border-radius: 14px; box-shadow: 0 0 0 3px #fff4dc, 0 6px 0 3px #000;
      padding: 10px 14px; min-height: 66px; font-size: 18px; font-weight: 600; line-height: 1.3; position: relative; }
    #box::after { content: "▼"; position: absolute; right: 12px; bottom: 4px; font-size: 12px; color: #a0522d; animation: nudge .6s ease-in-out infinite alternate; }
    @keyframes nudge { to { transform: translateY(3px); } }
    #moves { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; pointer-events: none; }
    #moves[hidden] { display: none !important; }
    .chip { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
      padding: 4px 2px 5px; min-height: 74px; border: 3px solid #000; border-radius: 12px; box-shadow: 0 4px 0 #000; color: #1a0f0a;
      background: var(--m, #d8c8a8); transition: transform .15s, filter .15s; }
    .chip img, .chip .glyph { width: 40px; height: 40px; object-fit: contain; font-size: 30px; line-height: 40px; filter: drop-shadow(0 2px 0 #0006); }
    .chip b { display: block; font-family: var(--comic); font-size: 20px; letter-spacing: .5px; line-height: 1; }
    .chip small { display: block; font-size: 10.5px; font-weight: 700; opacity: .8; line-height: 1.1; margin-top: 1px; }
    .chip.e-fire { --m: linear-gradient(#ffb36b, #ff6a3a); }
    .chip.e-frost { --m: linear-gradient(#d6f6ff, #7fcdf2); }
    .chip.e-thunder { --m: linear-gradient(#fff6a0, #ffd23c); }
    .chip.e-holy { --m: linear-gradient(#fffbe6, #ffe48a); }
    .chip.locked { --m: #3a2a2e; color: #7a6a6e; box-shadow: 0 2px 0 #000; }
    .chip.locked b { font-size: 34px; }
    .chip.tip::before { content: "\00d72!"; position: absolute; top: -13px; right: -4px; font-family: var(--comic); font-size: 20px; color: #ffe04a;
      -webkit-text-stroke: 3px #000; paint-order: stroke fill; transform: rotate(10deg); }
    #moves.pick .chip:not(.locked) { animation: chipPick .7s ease-in-out infinite alternate; }
    #moves.pick .chip:nth-child(2) { animation-delay: .12s; } #moves.pick .chip:nth-child(3) { animation-delay: .24s; } #moves.pick .chip:nth-child(4) { animation-delay: .36s; }
    @keyframes chipPick { to { transform: translateY(-7px) scale(1.04); filter: brightness(1.15); } }
    .chip.active { transform: translateY(-10px) scale(1.12); filter: brightness(1.2); z-index: 1; }
    #moves:has(.active) .chip:not(.active) { filter: grayscale(.8) brightness(.55); }

    /* ---------- overlays ---------- */
    .overlay { background: radial-gradient(ellipse at 50% 30%, #3a1d14f2, #120a08fa 70%); }
    .card h1 { font-family: var(--comic); font-weight: 400; letter-spacing: 1px; font-size: 42px; color: var(--gold); -webkit-text-stroke: 2px #000; paint-order: stroke fill; text-shadow: 0 4px 0 #000; }
    .card h2 { font-family: var(--comic); font-weight: 400; letter-spacing: 1px; font-size: 26px; color: var(--gold); text-shadow: 0 3px 0 #000; }
    .primary { font-family: var(--comic); font-weight: 400; letter-spacing: 1.5px; font-size: 28px; padding: 12px 36px 10px; border: 3px solid #000; border-radius: 16px;
      background: linear-gradient(#ffe27a, #ffb21a); color: #1a0f0a; box-shadow: 0 6px 0 #000; }
    .primary:active { transform: translateY(4px); box-shadow: 0 2px 0 #000; }
    .primary.mega { font-size: 40px; padding: 14px 44px 10px; animation: throb .7s ease-in-out infinite alternate; }

    #title .logo { margin: 6px auto 0; font-family: var(--comic); line-height: .82; transform: rotate(-5deg); }
    #title .logo span { display: block; font-size: 104px; color: #ffe04a; -webkit-text-stroke: 5px #000; paint-order: stroke fill;
      text-shadow: 0 4px 0 #b4380f, 0 8px 0 #7a1f08, 0 12px 0 #000, 0 0 40px #ff6a1a88; animation: wobble 2.2s ease-in-out infinite; }
    #title .logo span + span { color: #ff6a3a; margin-left: 30px; text-shadow: 0 4px 0 #8a1a1a, 0 8px 0 #4a0808, 0 12px 0 #000, 0 0 40px #ff3b1a88; animation-delay: -1.1s; }
    @keyframes wobble { 0%,100% { transform: rotate(-2deg) scale(1); } 50% { transform: rotate(2deg) scale(1.04); } }
    .lineup { position: relative; height: 170px; margin: 18px -16px 0; }
    .lineup img, .lineup span { position: absolute; bottom: 0; width: 42%; aspect-ratio: 1; object-fit: contain; filter: drop-shadow(0 6px 0 #0008); animation: lineup 2.4s ease-in-out infinite; }
    .lineup span { font-size: 80px; display: grid; place-items: end center; }
    @keyframes lineup { 50% { translate: 0 -8px; } }
    .pitch { font-size: 20px !important; font-weight: 700; color: var(--ink); }
    details.how { margin: 14px 0 0; text-align: left; background: #0006; border: 2px solid #ffffff22; border-radius: 12px; padding: 8px 12px; }
    details.how summary { font-family: var(--comic); font-size: 22px; letter-spacing: 1px; color: var(--gold); cursor: pointer; }
    details.how p { font-size: 16px; }

    #intro { padding: 0; align-items: stretch; overflow: hidden; background: #1a0b06; }
    #intro .burst { position: absolute; left: 50%; top: 34%; width: 260vmax; height: 260vmax; translate: -50% -50%;
      background: repeating-conic-gradient(#ff6a1a 0 8deg, #b4380f 8deg 16deg); animation: spin 18s linear infinite; opacity: .9; }
    #intro .burst::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle, #0000 4%, #1a0b06 30%); }
    @keyframes spin { to { rotate: 360deg; } }
    #intro .inner { position: relative; width: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: max(18px, env(safe-area-inset-top)) 18px 24px; text-align: center; }
    #intro-art { width: min(78vw, 340px); aspect-ratio: 1; display: grid; place-items: center; animation: slam .6s cubic-bezier(.2,1.6,.4,1) both; }
    #intro-art img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 8px 0 #000a); }
    #intro-art .glyph { font-size: 180px; }
    @keyframes slam { from { transform: translateX(120%) rotate(25deg) scale(.6); } 70% { transform: translateX(-4%) rotate(-4deg) scale(1.05); } }
    #intro-number { font-family: var(--comic); font-size: 20px; letter-spacing: 2px; color: #fff; background: #000; padding: 2px 14px; border-radius: 6px; transform: skew(-10deg); margin: 0; }
    #intro h1 { font-family: var(--comic); font-weight: 400; letter-spacing: 1px; color: var(--gold); -webkit-text-stroke: 2px #000; paint-order: stroke fill; text-shadow: 0 4px 0 #000; }
    #intro-name { font-size: 40px !important; margin: 8px 0 4px !important; line-height: 1 !important; animation: pop .5s cubic-bezier(.2,1.8,.4,1) .25s both; }
    #intro-types { justify-content: center; }
    .tagline { font-style: italic; color: #ffe7c4; font-weight: 600; text-shadow: 0 2px 2px #000; }
    .scroll { position: relative; background: #f3dfb0; color: #2a1a0a; border: 3px solid #000; border-radius: 6px; padding: 10px 14px; margin: 12px 0 4px;
      font-weight: 700; font-size: 18px; line-height: 1.3; box-shadow: 0 5px 0 #000; transform: rotate(-1.5deg); text-align: center; }
    .scroll small { display: block; font-family: var(--comic); font-weight: 400; font-size: 16px; letter-spacing: 1.5px; color: #a0281a; margin-bottom: 2px; }
    #intro-fight, .stamp { position: absolute; left: 50%; top: 42%; translate: -50% -50%; font-family: var(--comic); font-size: 130px; color: #ffe04a;
      -webkit-text-stroke: 6px #000; paint-order: stroke fill; text-shadow: 0 10px 0 #000; pointer-events: none; z-index: 3; }
    #intro-fight:not(:empty) { animation: ko 1s cubic-bezier(.2,1.6,.4,1) forwards; }
    .skip { position: absolute; bottom: max(10px, env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; font-size: 13px; color: #fff9; }

    #learn .card { position: relative; }
    #learn .kicker { font-family: var(--comic); font-size: 30px; letter-spacing: 2px; color: #fff; background: #e23d3d; display: inline-block; padding: 2px 18px; border: 3px solid #000; transform: rotate(-4deg); box-shadow: 0 4px 0 #000; margin-top: 24px; }
    #learn-img { width: 170px; height: 170px; object-fit: contain; margin: 16px auto 0; display: block; animation: slam .6s cubic-bezier(.2,1.6,.4,1) both, lineup 2s ease-in-out .6s infinite; filter: drop-shadow(0 0 30px #ffe04a88) drop-shadow(0 6px 0 #000); }
    #learn-gesture { font-family: var(--comic); font-size: 76px; line-height: 1; color: #fff; -webkit-text-stroke: 4px #000; paint-order: stroke fill; text-shadow: 0 6px 0 #000; transform: rotate(-4deg); animation: throb .5s ease-in-out infinite alternate; }
    #learn-img.glyph { font-size: 140px; width: auto; height: auto; }

    #over-art { width: min(70vw, 300px); aspect-ratio: 1; margin: 0 auto; display: grid; place-items: center; animation: gloat 1s ease-in-out infinite alternate; }
    #over-art img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 8px 0 #000a); }
    #over-art .glyph { font-size: 150px; }
    @keyframes gloat { from { transform: rotate(-4deg) scale(1); } to { transform: rotate(4deg) scale(1.06); } }
    #over h1 { font-size: 90px !important; color: #e23d3d !important; transform: rotate(-6deg); margin: -10px 0 0 !important; }
    .big-number { font-family: var(--comic); font-weight: 400; font-size: 56px; letter-spacing: 1px; -webkit-text-stroke: 2px #000; paint-order: stroke fill; text-shadow: 0 4px 0 #000; }
  </style>
</head>
<body>
  <div id="stage">
    <div id="bg"></div>
    <div id="aura"></div>
    <main id="app">
      <header id="hud">
        <div id="plate">
          <div id="foe-label"></div>
          <div id="foe-name"></div>
          <div id="foe-types" class="types"></div>
          <div id="foe-hp" hidden><i class="trail"></i><i class="fill"></i></div>
          <div id="foe-rule"></div>
        </div>
        <div id="side">
          <div id="score">0</div>
          <div id="hearts" role="img"></div>
        </div>
      </header>
      <div id="arena">
        <div id="strike" hidden><div class="band"></div><div id="clock"><i></i></div></div>
        <div id="foe-wrap"><div id="shadow"></div><div id="foe"></div></div>
      </div>
      <footer id="bottom">
        <div id="meter"><i></i></div>
        <div id="moves" hidden></div>
        <div id="box"><span id="line" aria-hidden="true"></span><span id="sr" class="sr" aria-live="polite"></span></div>
      </footer>
    </main>
    <div id="prompt"></div>
    <div id="pops"></div>
    <canvas id="fx"></canvas>
    <div id="flash"></div>
  </div>

  <section id="title" class="overlay">
    <div class="card">
      <div class="logo" aria-label="Shake Duel"><span>SHAKE</span><span>DUEL!</span></div>
      <div class="lineup" id="lineup" aria-hidden="true"></div>
      <p class="pitch" data-copy="pitch"></p>
      <div id="nosensors" class="warn" hidden></div>
      <button id="start" class="primary mega" type="button" data-copy="start"></button>
      <details class="how" open><summary data-copy="howTitle"></summary><div id="how"></div><p class="dim" data-copy="safety"></p></details>
      <h2 data-copy="hallTitle"></h2>
      <ol id="hall-title" class="hall"></ol>
    </div>
  </section>

  <section id="intro" class="overlay" hidden>
    <div class="burst"></div>
    <div class="inner">
      <p id="intro-number"></p>
      <div id="intro-art"></div>
      <h1 id="intro-name" class="card-h1"></h1>
      <div id="intro-types" class="types"></div>
      <p id="intro-tagline" class="tagline"></p>
      <div class="scroll"><small data-copy="houseRule"></small><span id="intro-rule"></span></div>
    </div>
    <div id="intro-fight"></div>
    <div class="skip" data-copy="tapSkip"></div>
  </section>

  <section id="learn" class="overlay center" hidden>
    <div class="card">
      <div class="kicker" data-copy="newMove"></div>
      <div id="learn-art"></div>
      <div id="learn-gesture"></div>
      <h1 id="learn-name"></h1>
      <div id="learn-types" class="types" style="justify-content:center"></div>
      <div class="scroll"><small data-copy="learnHow"></small><span id="learn-how"></span></div>
      <p id="learn-uses" class="dim"></p>
      <button id="learn-go" class="primary" type="button" data-copy="gotIt"></button>
    </div>
  </section>

  <section id="over" class="overlay" hidden>
    <div class="card">
      <div id="over-art"></div>
      <h1 data-copy="overTitle"></h1>
      <p id="over-by"></p>
      <p id="over-epitaph" class="tagline"></p>
      <p id="over-score" class="big-number"></p>
      <p id="over-detail" class="sub-number"></p>
      <form id="carve" class="carve">
        <label for="name" data-copy="namePrompt"></label>
        <div class="row">
          <input id="name" maxlength="12" autocomplete="nickname" enterkeyhint="done" required>
          <button class="primary" type="submit" data-copy="carve"></button>
        </div>
      </form>
      <p id="carved" class="carved" hidden></p>
      <button id="again" class="primary mega" type="button" data-copy="again"></button>
      <h2 data-copy="hallTitle"></h2>
      <ol id="hall-over" class="hall"></ol>
    </div>
  </section>

  <script type="module" src="game.js"></script>
</body>
</html>
