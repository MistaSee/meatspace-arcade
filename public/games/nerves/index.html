<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#efe6cf">
  <title>Nerves</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap">
  <style>
    html, body { margin: 0; height: 100%; background: #efe6cf; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    video { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    @font-face { font-family: "Scrawl"; src: url(../../shared/fonts/permanent-marker.woff2) format("woff2"); font-display: block; }
    /* Only here so the lettering is loaded before the chart draws with it. */
    .preload { position: absolute; left: -999px; font: 20px "Special Elite"; }
    .preload i { font-family: "Scrawl"; }
  </style>
</head>
<body>
  <canvas id="chart" aria-label="Nerves: a lie-detector chart of your own pulse"></canvas>
  <video id="lens" playsinline muted></video>
  <span class="preload" aria-hidden="true">A<i>A</i></span>
  <!-- Always fetch the newest game: phones otherwise keep an old copy for ten minutes after a fix. -->
  <script type="module">import(`./game.js?v=${Date.now()}`);</script>
</body>
</html>
