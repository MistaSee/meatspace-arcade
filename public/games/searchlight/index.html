<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Searchlight</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&display=swap">
  <style>
    /* Night. The only colour is the lamp's. Screens are kept dark on purpose: a glowing phone gives a creeper away. */
    :root { --lamp: #ffb52e; --low: #5c3d08; }
    html, body { margin: 0; height: 100%; background: #000; color: var(--lamp); overflow: hidden; overscroll-behavior: none; touch-action: none;
      -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; font-family: "Saira Stencil One", Impact, sans-serif; }
    canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    video { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    section { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 28px 24px; box-sizing: border-box; text-align: center; z-index: 2; pointer-events: none; }
    section.on { display: flex; }
    section > * { pointer-events: auto; }
    h1 { margin: 0; font-weight: 400; font-size: min(20.5vw, 14vh); line-height: 0.9; letter-spacing: 0.02em; }
    p { margin: 0; font-size: 17px; line-height: 1.35; letter-spacing: 0.06em; max-width: 26ch; color: #c98a1c; }
    p.low { color: var(--low); font-size: 14px; }
    button { font: inherit; font-size: 20px; letter-spacing: 0.1em; color: #000; background: var(--lamp); border: 0; padding: 16px 18px; min-width: 78vw; border-radius: 3px; }
    button:active { background: #fff; }
    button.low { background: none; color: var(--low); border: 2px solid var(--low); font-size: 15px; min-width: 0; padding: 12px 18px; }
    #guard, #creepTest, #armed { justify-content: space-between; }
    #clock, #big { font-size: min(22vw, 13vh); line-height: 1; }
    #lampWord { font-size: 20px; letter-spacing: 0.14em; }
    #guard > div, #creepTest > div { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    #count { font-size: 46vw; line-height: 1; }
    #armed { justify-content: flex-end; }
    #caught h1 { color: #000; font-size: min(23vw, 16vh); }
    #caught p { color: #000; font-size: 24px; max-width: none; }
  </style>
</head>
<body>
  <canvas id="view" aria-label="Searchlight: creep across a dark room without being caught in the beam"></canvas>
  <video id="cam" playsinline muted></video>

  <section id="home" class="on">
    <h1 id="title"></h1>
    <p id="rule"></p>
    <button id="beGuard"></button>
    <button id="beCreeper"></button>
    <p id="homeNote" class="low"></p>
  </section>

  <section id="guard">
    <div><div id="clock">0:00</div><p id="guardNote" class="low"></p></div>
    <div><div id="lampWord"></div><button id="touched" class="low"></button></div>
  </section>
  <section id="guardEnd">
    <p id="heldFor"></p>
    <div id="big"></div>
    <button id="guardAgain"></button>
  </section>

  <section id="creepTest">
    <div><p id="testFirst"></p><div id="lampWord2" style="font-size:22px;letter-spacing:.1em;min-height:1.2em"></div></div>
    <div><p id="chest" class="low"></p><button id="arm"></button></div>
  </section>
  <section id="creepCount"><div id="count"></div></section>
  <section id="armed"><button id="stop" class="low"></button></section>
  <section id="caught">
    <h1 id="caughtWord"></h1>
    <p id="backToWall"></p>
    <p id="tally"></p>
  </section>

  <!-- Always fetch the newest game: phones otherwise keep an old copy for ten minutes after a fix. -->
  <script type="module">import(`./game.js?v=${Date.now()}`);</script>
</body>
</html>
