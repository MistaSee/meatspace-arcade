<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Rally</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&display=swap">
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    /* The field-manual stage's type. Open-licensed; the licences are alongside the files. */
    @font-face { font-family: "TS Archivo"; src: url(../../shared/fonts/archivo-extracondensed-black.woff2) format("woff2"); font-display: block; }
    @font-face { font-family: "TS Mono"; src: url(../../shared/fonts/ibm-plex-mono-700.woff2) format("woff2"); font-display: block; }
    @font-face { font-family: "TS Readout"; src: url(../../shared/fonts/vt323.woff2) format("woff2"); font-display: block; }
    @font-face { font-family: "TS Marker"; src: url(../../shared/fonts/permanent-marker.woff2) format("woff2"); font-display: block; }
    /* Only here so the lettering is loaded before the game draws with it. */
    .preload { position: absolute; left: -999px; font: 20px "Bangers"; }
    .preload i:nth-child(1) { font-family: "TS Archivo"; } .preload i:nth-child(2) { font-family: "TS Mono"; }
    .preload i:nth-child(3) { font-family: "TS Readout"; } .preload i:nth-child(4) { font-family: "TS Marker"; }
  </style>
</head>
<body>
  <canvas id="view" aria-label="Rally: a bat and ball game played by turning the phone"></canvas>
  <span class="preload" aria-hidden="true">POW<i>A</i><i>A</i><i>A</i><i>A</i></span>
  <!-- Always fetch the newest game: phones otherwise keep an old copy for ten minutes after a fix. -->
  <script type="module">import(`./game.js?v=${Date.now()}`);</script>
</body>
</html>
