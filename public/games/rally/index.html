<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Rally</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&display=swap">
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    /* Only here so the comic lettering is loaded before the game draws with it. */
    .preload { position: absolute; left: -999px; font: 20px "Bangers"; }
  </style>
</head>
<body>
  <canvas id="view" aria-label="Rally: a bat and ball game played by turning the phone"></canvas>
  <span class="preload" aria-hidden="true">POW</span>
  <script type="module" src="game.js"></script>
</body>
</html>
