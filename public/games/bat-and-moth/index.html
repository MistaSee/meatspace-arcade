<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0c2f57">
  <title>Bat and Moth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap">
  <style>
    /* A blueprint plate from a naturalist's album: white shapes on deep Prussian blue. */
    :root { --blue: #0c2f57; --white: #eef3f6; --faint: #7f9cb8; }
    html, body { margin: 0; height: 100%; background: var(--blue); color: var(--white); overflow: hidden; overscroll-behavior: none; touch-action: none;
      -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; font-family: "IM Fell English", Georgia, serif; }
    canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    section { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 30px 28px; box-sizing: border-box; text-align: center; z-index: 2; pointer-events: none; }
    section.on { display: flex; }
    section > * { pointer-events: auto; }
    h1 { margin: 0; font-weight: 400; font-style: italic; font-size: min(15vw, 9vh); line-height: 1; }
    p { margin: 0; font-size: 18px; line-height: 1.4; max-width: 27ch; }
    p.faint, .faint { color: var(--faint); font-size: 15px; font-style: italic; }
    button { font: inherit; font-style: italic; font-size: 22px; color: var(--white); background: none; border: 1px solid var(--white); padding: 13px 22px; min-width: 70vw; border-radius: 40px; }
    button:active { background: var(--white); color: var(--blue); }
    button.faint { border-color: var(--faint); min-width: 0; font-size: 15px; padding: 9px 20px; }
    #home { justify-content: flex-end; padding-bottom: 7vh; }
    #moth, #bat { justify-content: space-between; }
    #moth > div, #bat > div { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    #clock, #big { font-size: min(17vw, 10vh); font-style: italic; line-height: 1; }
    #pitch { text-decoration: underline dotted; text-underline-offset: 5px; }
  </style>
</head>
<body>
  <canvas id="view" aria-label="Bat and Moth: hunt a silent phone by ear with your eyes shut"></canvas>

  <section id="home" class="on">
    <h1 id="title"></h1>
    <p id="rule"></p>
    <p id="clear" class="faint"></p>
    <button id="beMoth"></button>
    <button id="beBat"></button>
    <p id="homeNote" class="faint"></p>
  </section>

  <section id="moth">
    <div><div id="specimen" class="faint"></div><div id="clock">0:00</div></div>
    <div>
      <p id="volume" class="faint"></p>
      <p id="breath" class="faint"></p>
      <p id="pitch" class="faint"></p>
      <p id="lower" class="faint"></p>
      <button id="caught"></button>
    </div>
  </section>
  <section id="mothEnd">
    <p id="flewFor"></p>
    <div id="big"></div>
    <button id="mothAgain"></button>
  </section>

  <section id="bat">
    <div><p id="eyes"></p></div>
    <div><div id="hears" class="faint"></div><button id="stop" class="faint"></button></div>
  </section>

  <!-- Always fetch the newest game: phones otherwise keep an old copy for ten minutes after a fix. -->
  <script type="module">import(`./game.js?v=${Date.now()}`);</script>
</body>
</html>
